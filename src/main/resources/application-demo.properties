# Profil DEMO — base H2 en mémoire (mode compatibilité MySQL), aucune installation requise.
# Lancer avec : mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Base éphémère : repart à zéro à chaque démarrage. Ne contient QUE des comptes de test.
spring.datasource.url=jdbc:h2:mem:mcldemo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# Console H2 accessible sur http://localhost:8080/h2-console (jdbc url ci-dessus)
spring.h2.console.enabled=true
# Secret JWT de démo (non sensible — base jetable)
app.jwt.secret=secret-de-demo-uniquement-pour-tests-locaux-0123456789
app.jwt.expiration-hours=12
app.cors.allowed-origins=http://localhost:4200
