spring.application.name=backend
spring.profiles.active=local
# Clé API Anthropic Claude — à renseigner dans application-local.properties
anthropic.api.key=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# SQL en console : à activer ponctuellement en dev via application-local.properties
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Origines autorisées pour le CORS (séparées par des virgules)
app.cors.allowed-origins=http://localhost:4200
# Secret JWT (32 caractères minimum) — à définir dans application-local.properties.
# Laissé vide : une clé aléatoire est générée à chaque démarrage (les jetons expirent au redémarrage).
app.jwt.secret=
app.jwt.expiration-hours=12
