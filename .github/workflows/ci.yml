name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Les tests de sécurité (JwtServiceTest, SecuriteEndpointsTest) tournent sans base de données
      - name: Tests
        run: bash ./mvnw test
